# M02で許可対象ドメインをWireMockへ閉域転送する。

http_port 3128
acl all src all
acl api_domains dstdomain "/etc/squid/whitelist.txt"

cache_peer wiremock parent 8080 0 no-query
cache_peer_access wiremock allow api_domains
cache_peer_access wiremock deny all
never_direct allow api_domains

http_access allow api_domains
http_access deny all

# モックの応答をキャッシュしない。キャッシュすると、WireMock のシナリオ状態の変化が
# 古い応答で隠れ、リセット後の結果が毎回同じにならない（M07 の FR-706）。
cache deny all
cache_mem 256 MB
cache_dir ufs /var/spool/squid 1000 16 256
access_log /var/log/squid/access.log squid
cache_log /var/log/squid/cache.log
pid_filename none
