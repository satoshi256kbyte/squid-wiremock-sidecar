# CI。ローカルと同じ入口（test:ci）を実行する。
# Why not: Secrets は使わない。Secrets を使うと、フォークからの PR に値を渡す経路が生まれるため。
# このファイルの env に書くのはダミーの値だけで、実 AWS には接続しない（NFR-901、NFR-902）。
name: e2e-test
on:
  pull_request:
  push:
    branches: [main]
# Why not: 権限は読み取りだけにする。このワークフローはリポジトリへ書き込まない。
permissions:
  contents: read
# Why not: main への push まで ref 単位にすると、連続した push で古い実行が取り消される。
# main は SHA 単位にして、取り消し合わないようにする（NFR-910）。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Why not: 既定の認証情報（~/.aws や実 AWS）に頼らない。ダミーの値とリージョンを明示する（FR-905）。
env:
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: ap-northeast-1
jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Why not: 認証情報を Git の設定に残すと、後のステップで読める。残さない。
      # Why: アクションはコミット SHA で固定する。タグは付け替えられるため、取得物が変わらないようにする。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Why: shellcheck は mise の固定版を使う。install_args の --locked で mise.lock に従って導入する（plan 5.2）。
      # Why: アクションはコミット SHA で固定する。sha256 は linux-x64 の取得物を検証する。
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.3
          sha256: c2f7e814cb39f60b7f67a0ff36cb805e94128bf2dff09d175309d0f095b8cc3b
          cache: false
          env: false
          install_args: --locked
      - name: shellcheck
        # Why: 自動の導入を止める2つの環境変数は、mise which にだけ付ける。git ls-files には効かないため。
        run: git ls-files -z '*.sh' | xargs -0 "$(MISE_EXEC_AUTO_INSTALL=false MISE_AUTO_INSTALL=false mise which shellcheck)" -s sh -S style --
        timeout-minutes: 3
      # Why: actionlint は mise の固定版を使う。-shellcheck に同じ版の shellcheck を渡し、run: のシェルも検査する。
      - name: actionlint
        run: '"$(MISE_EXEC_AUTO_INSTALL=false MISE_AUTO_INSTALL=false mise which actionlint)" -shellcheck "$(MISE_EXEC_AUTO_INSTALL=false MISE_AUTO_INSTALL=false mise which shellcheck)" .github/workflows/e2e-test.yml'
        timeout-minutes: 2
      # Why: gitleaks は mise の固定版を使う。作業ツリーを dir で走査し、--redact で検出した値を出さない（FR-R0237）。
      - name: gitleaks
        run: '"$(MISE_EXEC_AUTO_INSTALL=false MISE_AUTO_INSTALL=false mise which gitleaks)" dir . --config .gitleaks.toml --redact --no-banner --exit-code 1'
        timeout-minutes: 2
      # 起動を含むため10分まで（Q-906）。
      # 4シナリオは、専用の step を作らず、同じ test-ci の検査列へ直列で足す（ローカルの test:ci と同じ順序）。
      - name: test-ci
        run: npm run test:ci && sh scripts/e2e.sh test:ci normal error-500-then-200 ratelimit-429 slow-5000
        timeout-minutes: 10
      # Why: 失敗しても実行する。test:ci の内側で集めた後の二度目で、タイムアウトに備える（3.7）。
      - name: collect
        if: always()
        run: sh scripts/e2e.sh collect
      # Why not: 成功時も上げると、保存量が増えるだけで調査には要らない。失敗時の収集物だけを残す（FR-916）。
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e-logs/
          retention-days: 7
          if-no-files-found: warn
      # Why: 後処理は必ず行う。残ったコンテナが次の実行の 8080 を塞ぐのを防ぐ（FR-911）。
      - name: stop
        if: always()
        run: npm run stop
