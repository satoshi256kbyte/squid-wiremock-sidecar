services:
  test-client:
    build:
      context: .
      dockerfile: Dockerfile.test-client
    environment:
      HTTP_PROXY: http://squid:3128
      HTTPS_PROXY: http://squid:3128
      NO_PROXY: localhost,127.0.0.1,squid,wiremock
      TEST_API_BASE_URL: http://api.example.com
    depends_on:
      squid:
        condition: service_healthy
      wiremock:
        condition: service_healthy
    networks:
      - sidecar
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  squid:
    image: ubuntu/squid:latest
    ports:
      - "3128:3128"
    volumes:
      - ./squid-config/squid.conf:/etc/squid/squid.conf:ro
    networks:
      - sidecar
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  wiremock:
    image: wiremock/wiremock:3.13.1
    ports:
      - "8080:8080"
    volumes:
      - ./wiremock-scenarios:/home/wiremock:ro
    networks:
      - sidecar
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  sidecar:
    driver: bridge
